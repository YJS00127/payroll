<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>급여 명세서</title>
    <link href="/css/style.css" rel="stylesheet">
    <link href="/css/modal.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragment/sidebar::sidebar}"></div>
<div th:replace="~{fragment/modal::modal}"></div>
<h1>근태 기록</h1>
<div class="app">
    <div id="searchBox"></div>
    <div id="attendanceList">
        <div class="list-container">
            <div class="list-header">
                <span id="totalAttendanceCount">총 0건</span>
                <div class="top-button">
                    <a href="/api/attendance/excel" id="excelDownload">엑셀 양식 다운로드</a>
                    <button id="excelUpload" onclick="uploadAttendanceExcel()">엑셀 업로드</button>
                    <button id="deleteSelectedBtn" onclick="delSelectedAttendance()">일괄 삭제</button>
                    <button id="addBtn" onclick="addAttendance()">등록</button>
                </div>
            </div>
        </div>
        <table class="list-table">
            <thead>
            <tr>
                <th><input type="checkbox" id="selectAll"></th>
                <th>사원명</th>
                <th>사원코드</th>
                <th>근태 날짜</th>
                <th>근로 시간</th>
                <th>총 근로 시간</th>
                <th>근로 상태</th>
                <th>관리</th>
            </tr>
            </thead>
            <tbody class="attendance-list"></tbody>
        </table>
    </div>
</div>
<div class="pagination"></div>
<script src="/js/common.js"></script>
<script src="/js/common/table.js"></script>
<script src="/js/common/modal.js"></script>
<script src="/js/common/search.js"></script>
<script src="/js/common/pagination.js"></script>
<script src="/js/attendance.js"></script>
</body>
</html>
