<!DOCTYPE html>
<html lang="en">
<script src="/js/common/table.js"></script>
<head>
    <meta charset="UTF-8">
    <title>급여 명세서</title>
    <link href="/css/style.css" rel="stylesheet">
    <link href="/css/modal.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragment/sidebar::sidebar}"></div>
<div th:replace="~{fragment/modal::modal}"></div>
<h1>근태 기록</h1>
<div class="app">
    <div id="searchBox"></div>
    <div class="list-tabs">
        <button type="button" onclick="changeMode('emp')">사원 목록</button>
        <button type="button" onclick="changeMode('attendance')">근태 목록</button>
    </div>
    <div id="employeeList">
        <div class="list-container">
            <div class="list-header">
                <span id="totalEmpCount">총 0건</span>
            </div>
        </div>
        <table class="list-table">
            <thead>
            <tr>
                <th>사원명</th>
                <th>사원코드</th>
                <th>일괄등록/등록</th>
            </tr>
            </thead>
            <tbody class="emp-list"></tbody>
        </table>
    </div>
    <div id="attendanceList" hidden>
        <div class="list-container">
            <div class="list-header">
                <span id="totalAttendanceCount">총 0건</span>
                <div class="button-delete-add">
                    <button id="deleteSelectedBtn" onclick="delSelectedAttendance()">삭제</button>
                    <button id="addBtn" onclick="addAttendance()">등록</button>
                </div>
            </div>
        </div>
        <table class="list-table">
            <thead>
            <tr>
                <th><input type="checkbox" id="selectAll"></th>
                <th>근태 날짜</th>
                <th>근로 시간</th>
                <th>수정/삭제</th>
            </tr>
            </thead>
            <tbody class="attendance-list"></tbody>
        </table>
    </div>
</div>
<div class="pagination"></div>
<script src="/js/common/modal.js"></script>
<script src="/js/attendance.js"></script>
<script src="/js/common/search.js"></script>
<script src="/js/common/pagination.js"></script>
</body>
</html>
