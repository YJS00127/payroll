<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>급여 명세서</title>
    <link href="/css/style.css" rel="stylesheet">
    <link href="/css/modal.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragment/sidebar::sidebar}"></div>
<div th:replace="~{fragment/modal::modal}"></div>
<h1>급여 명세서</h1>
<div class="app">
    <div id="searchBox"></div>
    <div id="payslipList">
        <div class="list-container">
            <div class="list-header">
                <span id="totalCount">총 0건</span>
                <div class="top-button">
                    <button id="confirmedPayrollBtn" onclick="confirmedPayroll()">급여 확정</button>
                    <button id="cancelConfirmedBtn" onclick="cancelConfirmed()">확정 취소</button>
                    <button id="confirmedPaymentBtn" onclick="confirmedPayment()">지급 확정</button>
                    <button id="pdf" onclick="ExportPDF()">PDF 출력</button>
                </div>
            </div>
        </div>
        <table class="list-table">
            <thead>
            <tr>
                <th><input type="checkbox" id="selectAll"></th>
                <th>기준연월</th>
                <th>사원명</th>
                <th>사원코드</th>
                <th>지급일</th>
                <th>급여 상태</th>
                <th>관리</th>
            </tr>
            </thead>
            <tbody class="payslip-list"></tbody>
        </table>
    </div>
</div>
<div class="pagination"></div>
<script src="/js/common.js"></script>
<script src="/js/common/table.js"></script>
<script src="/js/common/modal.js"></script>
<script src="/js/common/search.js"></script>
<script src="/js/common/pagination.js"></script>
<script src="/js/payslip.js"></script>
</body>
</html>
